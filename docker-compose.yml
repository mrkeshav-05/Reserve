services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: foodlink
      POSTGRES_PASSWORD: foodlink_password
      POSTGRES_DB: foodlink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodlink"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5001:3000"
    environment:
      - DATABASE_URL=postgres://foodlink:foodlink_password@db:5432/foodlink
      - NODE_ENV=production
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:5001}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
